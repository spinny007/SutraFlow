# SutraFlow (2.1.6): release pipeline for GitHub Actions. Copy to .github/workflows/sutraflow-deploy.yml
# in the repository that holds your SutraFlow project files (Git tab of the studio).
#
# Stages: build the release from Git, check it and the config file against the server (the plan and
# its id), test it, then a person approves (the "production" environment's required reviewers) and
# the config is applied (only what is missing is created) and the release deployed with --approve
# <plan id>. If the server changed after the approval, the plan id no longer matches and nothing changes.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUTRA_SERVER  the engine's admin address (https://sutra-admin.example.internal)
#   SUTRA_TOKEN   a system account's token (sutra token create ci-deployer pipeline)
#   plus every ${env:NAME} your env/prod.yaml names (database passwords, API keys).
# Settings > Environments > production: add the required reviewers (they approve the plan).
name: SutraFlow release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: { image: 'ghcr.io/spinny007/sutraflow:2.1.7', options: --user root }
    steps:
      - uses: actions/checkout@v4
      - name: Build the release from the project files
        run: node /app/dist/server/cli.js package --from-git . --version "${GITHUB_REF_NAME#v}" --out release.zip
      - name: Test it in a throw-away server
        run: node /app/dist/server/cli.js test release.zip --secrets-from-env
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release.zip }

  check:
    needs: build
    runs-on: ubuntu-latest
    container: { image: 'ghcr.io/spinny007/sutraflow:2.1.7', options: --user root }
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    env:
      SUTRA_SERVER: ${{ secrets.SUTRA_SERVER }}
      SUTRA_ADMIN_TOKEN: ${{ secrets.SUTRA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release }
      - name: What the config file would create, and what is already there
        run: node /app/dist/server/cli.js config check config/sutraflow.yaml --env config/env/prod.yaml --checklist config-checklist.md
      - name: The deployment plan
        id: plan
        run: |
          node /app/dist/server/cli.js check release.zip --keep-others --checklist plan.md
          node /app/dist/server/cli.js check release.zip --keep-others --json > plan.json
          echo "plan=$(node -e "console.log(require('./plan.json').plan.planId)")" >> "$GITHUB_OUTPUT"
          cat plan.md config-checklist.md >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # The approval: the reviewers read the plan in the check job's summary, then approve.
    environment: production
    container: { image: 'ghcr.io/spinny007/sutraflow:2.1.7', options: --user root }
    env:
      SUTRA_SERVER: ${{ secrets.SUTRA_SERVER }}
      SUTRA_ADMIN_TOKEN: ${{ secrets.SUTRA_TOKEN }}
      SUTRA_CI_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release }
      - name: Create what is missing
        run: node /app/dist/server/cli.js config apply config/sutraflow.yaml --env config/env/prod.yaml --yes --checklist config-checklist.md
        # Secrets the config names as ${env:NAME}:
        env:
          ERP_DB_PASSWORD: ${{ secrets.ERP_DB_PASSWORD }}
      - name: Deploy the approved plan
        run: node /app/dist/server/cli.js deploy release.zip --keep-others --approve "${{ needs.check.outputs.plan }}"
      - if: always()
        run: cat config-checklist.md >> "$GITHUB_STEP_SUMMARY" || true
