# SutraFlow (2.1.6): release pipeline for GitLab CI. Copy to .gitlab-ci.yml in the repository that
# holds your SutraFlow project files.
#
# Settings > CI/CD > Variables (masked, protected): SUTRA_SERVER, SUTRA_TOKEN (a system account's
# token), and every ${env:NAME} your env/prod.yaml names. The deploy job is manual: a person reads
# the plan (check job log and plan.md artifact) and presses play. Protect the production environment
# (Settings > CI/CD > Protected environments) to choose who may.
image:
  name: ghcr.io/spinny007/sutraflow:2.1.7
  entrypoint: [""]

variables:
  SUTRA: node /app/dist/server/cli.js

stages: [build, check, deploy]

build:
  stage: build
  rules: [{ if: $CI_COMMIT_TAG }]
  script:
    - $SUTRA package --from-git . --version "${CI_COMMIT_TAG#v}" --out release.zip
    - $SUTRA test release.zip --secrets-from-env
  artifacts: { paths: [release.zip], expire_in: 30 days }

check:
  stage: check
  rules: [{ if: $CI_COMMIT_TAG }]
  variables: { SUTRA_ADMIN_TOKEN: $SUTRA_TOKEN }
  script:
    - $SUTRA config check config/sutraflow.yaml --env config/env/prod.yaml --checklist config-checklist.md
    - $SUTRA check release.zip --keep-others --checklist plan.md
    - $SUTRA check release.zip --keep-others --json > plan.json
    - echo "PLAN_ID=$(node -e "console.log(require('./plan.json').plan.planId)")" > plan.env
    - cat plan.md
  artifacts:
    paths: [plan.md, config-checklist.md]
    reports: { dotenv: plan.env }

deploy:
  stage: deploy
  rules: [{ if: $CI_COMMIT_TAG, when: manual }]
  environment: { name: production }
  needs: [build, check]
  variables: { SUTRA_ADMIN_TOKEN: $SUTRA_TOKEN, SUTRA_CI_USER: $GITLAB_USER_LOGIN }
  script:
    - $SUTRA config apply config/sutraflow.yaml --env config/env/prod.yaml --yes --checklist config-checklist.md
    - $SUTRA deploy release.zip --keep-others --approve "$PLAN_ID"
  artifacts: { paths: [config-checklist.md], when: always }
