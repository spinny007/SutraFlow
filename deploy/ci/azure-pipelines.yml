# SutraFlow (2.1.6): release pipeline for Azure DevOps. Copy to azure-pipelines.yml in the repository
# that holds your SutraFlow project files.
#
# Library > variable group "sutraflow-prod" (secret values): SUTRA_SERVER, SUTRA_TOKEN (a system
# account's token), and every ${env:NAME} your env/prod.yaml names. Pipelines > Environments >
# "sutraflow-prod" > Approvals and checks: add the approvers; they read the plan in the Check stage's
# log and the plan artifact before approving.
trigger:
  tags: { include: ['v*'] }

variables:
  - group: sutraflow-prod
  - name: SUTRA
    value: node /app/dist/server/cli.js

resources:
  containers:
    - container: sutraflow
      image: ghcr.io/spinny007/sutraflow:2.1.8
      options: --user 0:0

stages:
  - stage: Build
    jobs:
      - job: build
        pool: { vmImage: ubuntu-latest }
        container: sutraflow
        steps:
          - checkout: self
          - script: $(SUTRA) package --from-git . --version "$(Build.SourceBranchName)" --out release.zip
          - script: $(SUTRA) test release.zip --secrets-from-env
          - publish: release.zip
            artifact: release

  - stage: Check
    dependsOn: Build
    jobs:
      - job: check
        pool: { vmImage: ubuntu-latest }
        container: sutraflow
        steps:
          - checkout: self
          - download: current
            artifact: release
          - script: |
              $(SUTRA) config check config/sutraflow.yaml --env config/env/prod.yaml --checklist config-checklist.md
              $(SUTRA) check $(Pipeline.Workspace)/release/release.zip --keep-others --checklist plan.md
              $(SUTRA) check $(Pipeline.Workspace)/release/release.zip --keep-others --json > plan.json
              echo "##vso[task.setvariable variable=planId;isOutput=true]$(node -e "console.log(require('./plan.json').plan.planId)")"
            name: plan
            env: { SUTRA_SERVER: $(SUTRA_SERVER), SUTRA_ADMIN_TOKEN: $(SUTRA_TOKEN) }
          - publish: plan.md
            artifact: plan

  - stage: Deploy
    dependsOn: Check
    variables:
      planId: $[ stageDependencies.Check.check.outputs['plan.planId'] ]
    jobs:
      # The environment's approval is the person's OK for this plan.
      - deployment: deploy
        environment: sutraflow-prod
        pool: { vmImage: ubuntu-latest }
        container: sutraflow
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: release
                - script: |
                    $(SUTRA) config apply config/sutraflow.yaml --env config/env/prod.yaml --yes --checklist config-checklist.md
                    $(SUTRA) deploy $(Pipeline.Workspace)/release/release.zip --keep-others --approve "$(planId)"
                  env: { SUTRA_SERVER: $(SUTRA_SERVER), SUTRA_ADMIN_TOKEN: $(SUTRA_TOKEN), SUTRA_CI_USER: $(Build.RequestedFor), ERP_DB_PASSWORD: $(ERP_DB_PASSWORD) }
