# SutraFlow at http://sutra.test: Apache forwards to the Node.js server on 127.0.0.1:4810.
# The file name sorts before Laragon's auto.*.conf, so this host wins over the automatic one.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

<VirtualHost *:80>
    ServerName sutra.test
    ServerAlias *.sutra.test
    ProxyPreserveHost On
    ProxyRequests Off
    # Server-sent events (live run status) must not be buffered.
    SetEnv proxy-sendchunked 1
    ProxyPass / http://127.0.0.1:4810/ flushpackets=on timeout=300
    ProxyPassReverse / http://127.0.0.1:4810/
</VirtualHost>
