# SutraFlow (2.1.6): applies the environment's config file, then deploys a release, from inside the
# cluster (the admin API is not published). Run by the pipeline after a person approved the plan:
#
#   kubectl -n sutraflow-prod create configmap sutraflow-config --from-file=sutraflow.yaml --from-file=env.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
#   RELEASE_URL=https://artifacts.example.com/orders-1.4.0.zip PLAN_ID=3f9c2a1b7d4e RUN=$(date +%s) \
#     envsubst < deploy/kubernetes/jobs/config-and-deploy.yaml | kubectl -n sutraflow-prod apply -f -
#   kubectl -n sutraflow-prod wait --for=condition=complete job/sutraflow-deploy-$RUN --timeout=10m
#
# The config apply creates what is missing only; existing items are listed in the Job's log (the
# checklist). The deploy replaces Sutras only with the approved plan id: if the server changed since the
# approval, the id no longer matches and the Job fails (exit code 3) without changing anything.
apiVersion: batch/v1
kind: Job
metadata:
  name: sutraflow-deploy-${RUN}
  labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: deploy }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: deploy, sutraflow-admin: "true" }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: deploy
          image: ghcr.io/spinny007/sutraflow:2.1.8
          env:
            - { name: SUTRA_SERVER, value: "http://sutraflow-engine:4800" }
            # A system account's token (sutra token create), not the admin token.
            - name: SUTRA_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: sutraflow-pipeline, key: token } }
            - { name: SUTRA_CI_USER, value: "${CI_USER}" }
            - { name: RELEASE_URL, value: "${RELEASE_URL}" }
            - { name: PLAN_ID, value: "${PLAN_ID}" }
          # Values the config file names as ${env:NAME}: the environment's secrets.
          envFrom:
            - secretRef: { name: sutraflow-env-secrets, optional: true }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              node -e "fetch(process.env.RELEASE_URL).then(async r => { if (!r.ok) throw new Error('release: ' + r.status); require('fs').writeFileSync('/tmp/release.zip', Buffer.from(await r.arrayBuffer())); })"
              node dist/server/cli.js config apply /config/sutraflow.yaml --env /config/env.yaml --yes
              node dist/server/cli.js deploy /tmp/release.zip --approve "$PLAN_ID"
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            # Secrets the config file reads as file:/run/secrets/<name>.
            - { name: secret-files, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: sutraflow-config }
        - name: secret-files
          secret: { secretName: sutraflow-secret-files, optional: true }
        - { name: tmp, emptyDir: {} }
