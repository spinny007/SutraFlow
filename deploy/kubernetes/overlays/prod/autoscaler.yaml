# More engines under load, fewer when quiet; a pod scaled away drains first (its running steps finish).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sutraflow-engine
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sutraflow-engine }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
