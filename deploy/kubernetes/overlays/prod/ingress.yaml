# The gateway (the engines' port 8080) under one host; TLS ends at the ingress. The admin API is not
# published: the pipeline reaches it inside the cluster (the Job) or through kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sutraflow-gateway
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.com]
      secretName: sutraflow-gateway-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sutraflow-engine, port: { name: http } }
