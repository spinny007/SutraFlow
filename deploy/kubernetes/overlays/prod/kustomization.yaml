# SutraFlow (2.1.6): production: three engines (two to ten with the autoscaler), the gateway behind
# an Ingress, no studio. Set the host in ingress.yaml and the ingress controller's address range as a
# trusted proxy in the server config file (server.gateway.trustedProxies), so callers' addresses are
# read from X-Forwarded-For.
#   kubectl apply -k deploy/kubernetes/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sutraflow-prod
resources:
  - ../../base
  - ingress.yaml
  - autoscaler.yaml
images:
  - name: ghcr.io/spinny007/sutraflow
    newTag: "2.1.6"
replicas:
  - name: sutraflow-engine
    count: 3
