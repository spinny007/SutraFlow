# SutraFlow (2.1.6): a test environment: one engine and the studio.
#   kubectl create namespace sutraflow-test
#   kubectl -n sutraflow-test create secret generic sutraflow --from-literal=... (see base/config.yaml)
#   kubectl apply -k deploy/kubernetes/overlays/test
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sutraflow-test
resources:
  - ../../base
components:
  - ../../components/studio
images:
  - name: ghcr.io/spinny007/sutraflow
    newTag: "2.1.8"
replicas:
  - name: sutraflow-engine
    count: 1
patches:
  - target: { kind: ConfigMap, name: sutraflow }
    patch: |-
      - op: replace
        path: /data/SUTRA_ENVIRONMENT
        value: test
  # One engine: nothing to keep available while a node drains.
  - target: { kind: PodDisruptionBudget, name: sutraflow-engine }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
