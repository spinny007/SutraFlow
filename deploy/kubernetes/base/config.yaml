# SutraFlow (2.1.6): settings every pod reads. Secrets (admin token, master key, database address)
# are in the Secret named sutraflow, made by hand or by your secret manager, never in Git:
#   kubectl -n <namespace> create secret generic sutraflow \
#     --from-literal=SUTRA_ADMIN_TOKEN=$(openssl rand -hex 24) \
#     --from-literal=SUTRA_MASTER_KEY=$(openssl rand -base64 32) \
#     --from-literal=SUTRA_DB=postgres://sutra:password@db.example.internal:5432/sutra
# Server settings (gateway, firewall, trusted proxies, roles, system accounts, alerts) are not here:
# they are a config file applied with `sutra config apply` (see jobs/config-and-deploy.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sutraflow
data:
  SUTRA_ENVIRONMENT: production
  SUTRA_LOG_FORMAT: json
