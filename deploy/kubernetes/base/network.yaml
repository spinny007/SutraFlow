# SutraFlow (2.1.6): the gateway ports are open to callers; the admin API (4800) only to pods
# labelled sutraflow-admin: "true" in this namespace (the studio, the config and deploy Job).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sutraflow-engine
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }, { port: 8443 }]
    - from:
        - podSelector: { matchLabels: { sutraflow-admin: "true" } }
        # Engines reach each other's admin API (drain and restart requests).
        - podSelector: { matchLabels: { app.kubernetes.io/name: sutraflow } }
      ports: [{ port: 4800 }]
