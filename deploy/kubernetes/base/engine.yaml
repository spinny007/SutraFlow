# SutraFlow (2.1.6): headless engines. They share PostgreSQL (SUTRA_DB in the sutraflow Secret);
# work is shared, each step runs once, one engine leads timers and listeners. Every engine uses the
# same SUTRA_MASTER_KEY. Readiness is /ready (it fails while draining), liveness /health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sutraflow-engine
  labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
    spec:
      # Running steps finish before a pod stops (the engine drains on SIGTERM).
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: engine
          image: ghcr.io/spinny007/sutraflow:2.1.8
          envFrom:
            - configMapRef: { name: sutraflow }
            - secretRef: { name: sutraflow }
          env:
            - { name: SUTRA_MODE, value: engine }
            # Each engine's name in the Admin Console: the pod's name.
            - name: SUTRA_ENGINE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: admin, containerPort: 4800 }
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          startupProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Logs and work files; the database holds everything else. Project files shared by every
        # engine (${files}) need a ReadWriteMany volume here instead: see deploy/kubernetes/README.md.
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: sutraflow-engine
  labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
spec:
  selector: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
    - { name: admin, port: 4800, targetPort: admin }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sutraflow-engine
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: engine }
