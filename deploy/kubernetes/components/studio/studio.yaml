apiVersion: apps/v1
kind: Deployment
metadata:
  name: sutraflow-studio
  labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: studio }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: studio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: studio, sutraflow-admin: "true" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: studio
          image: ghcr.io/spinny007/sutraflow:2.1.6
          envFrom:
            - configMapRef: { name: sutraflow }
            - secretRef: { name: sutraflow }
          env:
            - { name: SUTRA_MODE, value: studio }
            - { name: SUTRA_WORKERS, value: "0" }
            - { name: SUTRA_ENGINE_ID, value: studio }
          ports:
            - { name: admin, containerPort: 4800 }
          readinessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: sutraflow-studio
spec:
  selector: { app.kubernetes.io/name: sutraflow, app.kubernetes.io/component: studio }
  ports:
    - { name: admin, port: 4800, targetPort: admin }
