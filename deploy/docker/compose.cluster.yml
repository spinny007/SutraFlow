#
# A cluster from the image (2.1.6): PostgreSQL (with pgvector), a studio without workers and two
# headless engines sharing the database. Work is shared, each step runs once, one engine leads
# (timers, folder and mailbox listeners), and a stopped engine's steps are finished by another.
#
#   cp deploy/docker/env.example .env      (fill in SUTRA_VERSION, SUTRA_ADMIN_TOKEN, SUTRA_MASTER_KEY, POSTGRES_PASSWORD)
#   docker compose -f deploy/docker/compose.cluster.yml --env-file .env up -d
#
# Every engine uses the same SUTRA_MASTER_KEY: the vault is in the shared database.
# Put a load balancer in front of the engines' gateway ports and point its health check at /ready.
# For production, use a managed PostgreSQL (set SUTRA_DB) and remove the postgres service.
x-engine: &engine
  image: ${SUTRA_IMAGE:-sutraflow}:${SUTRA_VERSION:?set SUTRA_VERSION, e.g. 2.1.7}
  depends_on:
    postgres: { condition: service_healthy }
  environment: &engine-env
    SUTRA_MODE: engine
    SUTRA_DB: ${SUTRA_DB:-postgres://sutra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sutra}
    SUTRA_ADMIN_TOKEN: ${SUTRA_ADMIN_TOKEN:?set SUTRA_ADMIN_TOKEN}
    SUTRA_MASTER_KEY: ${SUTRA_MASTER_KEY:?set SUTRA_MASTER_KEY}
    SUTRA_ENVIRONMENT: ${SUTRA_ENVIRONMENT:-production}
  volumes: ["${SUTRA_DEPLOY_FOLDER:-./deploy-drop}:/deploy:ro"]
  stop_grace_period: 45s
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sutra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sutra
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutra -d sutra"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  studio:
    image: ${SUTRA_IMAGE:-sutraflow}:${SUTRA_VERSION}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SUTRA_MODE: studio
      SUTRA_DB: ${SUTRA_DB:-postgres://sutra:${POSTGRES_PASSWORD}@postgres:5432/sutra}
      SUTRA_ADMIN_TOKEN: ${SUTRA_ADMIN_TOKEN}
      SUTRA_MASTER_KEY: ${SUTRA_MASTER_KEY}
      SUTRA_WORKERS: "0"
    ports: ["4800:4800"]
    restart: unless-stopped

  engine-1:
    <<: *engine
    environment: { <<: *engine-env, SUTRA_ENGINE_ID: engine-1 }
    ports: ["9080:8080"]

  engine-2:
    <<: *engine
    environment: { <<: *engine-env, SUTRA_ENGINE_ID: engine-2 }
    ports: ["9081:8080"]

volumes:
  pg-data:
