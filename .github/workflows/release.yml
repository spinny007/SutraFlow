#
# Release: pushing a tag such as v2.0.0 tests SutraFlow, builds the release archives on Windows and
# Linux (each with an offline archive holding the runtime packages for that system), and attaches
# them with their SHA-256 files and RELEASE-NOTES.md to a GitHub Release.
#
# 2.1.6: also the SutraFlow image, built and checked on every run, and on a tag pushed for
# linux/amd64 and linux/arm64 with an SBOM and build provenance, then signed with cosign (keyless,
# this workflow's GitHub identity). GHCR by default; another registry through the inputs of a manual
# run and the REGISTRY_USERNAME and REGISTRY_PASSWORD secrets.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      registry:
        description: 'Registry for the image (ghcr.io, docker.io, myregistry.azurecr.io, ...)'
        default: ghcr.io
      image:
        description: 'Image name in the registry (empty: <owner>/sutraflow)'
        default: ''
      push:
        description: 'Push the image (a manual run builds and checks it only, unless this is true)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run vendor:check:online
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            only: windows
          - os: ubuntu-latest
            only: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node tools/build-release.mjs --offline --only=${{ matrix.only }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
      IMAGE: ${{ inputs.image || format('{0}/sutraflow', github.repository_owner) }}
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push == true }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$REGISTRY/$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for this runner and check it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sutraflow:check
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts, answers and reports its version
        run: |
          docker run -d --name check -e SUTRA_ADMIN_TOKEN=check-$RANDOM$RANDOM -p 4800:4800 sutraflow:check
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4800/health > health.json && break; sleep 1; done
          cat health.json
          test "$(node -p "require('./health.json').version")" = "${{ steps.v.outputs.version }}"
          for u in /guide /admin-guide /design-guide /architecture /admin; do curl -fs -o /dev/null "http://127.0.0.1:4800$u"; done
          test "$(docker exec check id -u)" != "0"
          docker stop check
          test "$(docker inspect check --format '{{.State.ExitCode}}')" = "0"
      - name: Sign in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build for amd64 and arm64 and push, with SBOM and provenance
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: Sign the image (keyless)
        if: env.PUSH == 'true'
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}"
      - name: Where it is
        if: env.PUSH == 'true'
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\` (digest \`${{ steps.push.outputs.digest }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the signature: \`cosign verify ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }} --certificate-identity-regexp '^${{ github.server_url }}/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: out
          # Only the archives: the image job's build records (*.dockerbuild) are artifacts too and are not release files.
          pattern: release-*
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # GitHub refuses a release text over 125000 characters (2.1.8 failed here): the release page gets
          # this release's part of RELEASE-NOTES.md only, up to the first "## Previous release" heading.
          # The whole file still ships inside every archive.
          awk '/^## Previous release/ { exit } { print }' RELEASE-NOTES.md > release-body.md
          echo "" >> release-body.md
          echo "Earlier releases: see RELEASE-NOTES.md in the archive or in the repository." >> release-body.md
          SIZE=$(wc -m < release-body.md)
          echo "Release text: $SIZE characters"
          test "$SIZE" -lt 125000 || { echo "::error::The release text is $SIZE characters; GitHub allows 125000. Shorten this release's part of RELEASE-NOTES.md."; exit 1; }
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" out/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "SutraFlow ${GITHUB_REF_NAME#v}" --notes-file release-body.md
          else
            gh release create "${GITHUB_REF_NAME}" out/* --title "SutraFlow ${GITHUB_REF_NAME#v}" --notes-file release-body.md
          fi
